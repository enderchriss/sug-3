<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUG 3</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js"></script>
</head>
<body>
    <div id="splash-screen-container">
        <div id="splash-screen">SKIPPERS UNBLOCKED GAMES 3</div>
    </div>

    <div id="update-splash-container">
        <div id="update-splash">SUG-3 was updated to V1.0, see CHANGELOG <a href="">here</a></div>
    </div>
    
    <div id="header">
        <div id="nav-grid">
            <button id="games-button" class="nav-button">Games</button>
            <button id="info-button" class="nav-button">Info</button>
            <input id="search-button" type="text" placeholder="Search for a game..">
        </div>
        <div id="genre-grid">
            <div id="all-genre" class="genre-icon" title="All">All</div>
            <div id="mobile-genre" class="genre-icon" title="Mobile"><img src="https://cdn.brandfetch.io/idWI4rCqjh/w/400/h/400/theme/dark/icon.png?c=1dxbfHSJFAPEGdCLU4o5B" alt=""></div>
            <div id="steam-genre" class="genre-icon" title="Steam"><img src="https://cdn2.steamgriddb.com/icon/c81e155d85dae5430a8cee6f2242e82c/32/256x256.png" alt=""></div>
            <div id="flash-genre" class="genre-icon" title="Flash"><img src="https://cdn2.steamgriddb.com/thumb/1b4922a7cfe6a5e07c5406fad241afea.jpg" alt=""></div>
            <div id="external-genre" class="genre-icon" title="External"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-filter-2-question"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 6h16" /><path d="M6 12h10.5" /><path d="M9 18h5" /><path d="M19 22v.01" /><path d="M19 19c.448 -.001 .883 -.153 1.235 -.431c.352 -.278 .6 -.666 .706 -1.101c.105 -.436 .061 -.894 -.125 -1.302c-.186 -.408 -.504 -.742 -.902 -.948c-.398 -.204 -.853 -.267 -1.291 -.179c-.438 .088 -.834 .321 -1.123 .662" /></svg></div>
        </div>
        
    </div>
    <div id="game-container"></div>
</body>
</html>
